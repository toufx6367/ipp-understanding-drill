<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2367d1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IPP理解ドリル">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>IPP理解ドリル</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #eef3f7;
      --ink: #1f2430;
      --muted: #697386;
      --line: #dce3ea;
      --blue: #2367d1;
      --teal: #008c8c;
      --coral: #e05b52;
      --amber: #d79212;
      --green: #178a53;
      --violet: #6d5bd0;
      --shadow: 0 18px 60px rgba(31, 36, 48, 0.12);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(35, 103, 209, 0.06), rgba(23, 138, 83, 0.04) 45%, rgba(224, 91, 82, 0.04)),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      min-height: 100vh;
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 24px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 14px;
      align-items: center;
      margin-bottom: 22px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      font-weight: 850;
      box-shadow: 0 14px 30px rgba(35, 103, 209, 0.25);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 22px;
      line-height: 1.1;
    }

    .brand p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .segmented,
    .filter-row {
      display: grid;
      gap: 7px;
    }

    .segmented {
      grid-template-columns: repeat(2, 1fr);
      margin-bottom: 12px;
    }

    .filter-row {
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 16px;
    }

    .segmented button,
    .filter-row button,
    .control {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-weight: 700;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
    }

    .segmented button:hover,
    .filter-row button:hover,
    .control:hover,
    .chapter-button:hover {
      transform: translateY(-1px);
    }

    .segmented button.active,
    .filter-row button.active {
      color: #fff;
      border-color: transparent;
      background: var(--ink);
    }

    .rail-section-title {
      margin: 18px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .chapter-list {
      display: grid;
      gap: 8px;
      padding-bottom: 24px;
    }

    .chapter-button {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .chapter-button.active {
      border-color: var(--blue);
      box-shadow: 0 10px 25px rgba(35, 103, 209, 0.16);
    }

    .chapter-title {
      font-size: 13px;
      font-weight: 760;
      line-height: 1.35;
    }

    .chapter-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .stage {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: 28px;
      min-width: 0;
    }

    .topline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
    }

    .meter-wrap {
      display: grid;
      gap: 8px;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .meter {
      height: 10px;
      border-radius: 999px;
      background: #dfe6ed;
      overflow: hidden;
    }

    .meter span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), var(--blue), var(--amber));
      transition: width 0.32s ease;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 86px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .quiz-shell,
    .result-shell {
      position: relative;
      align-self: center;
      width: min(940px, 100%);
      margin: 0 auto;
      padding: clamp(18px, 3vw, 32px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .quiz-shell.correct-pulse {
      animation: correctPulse 620ms ease;
    }

    .quiz-shell.wrong-shake {
      animation: wrongShake 480ms cubic-bezier(.36,.07,.19,.97);
    }

    .question-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 18px;
    }

    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(35, 103, 209, 0.1);
      color: var(--blue);
      font-size: 12px;
      font-weight: 850;
    }

    .tag.logic {
      color: var(--teal);
      background: rgba(0, 140, 140, 0.12);
    }

    .tag.debug {
      color: var(--coral);
      background: rgba(224, 91, 82, 0.12);
    }

    .tag.library {
      color: var(--violet);
      background: rgba(109, 91, 208, 0.12);
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    h2 {
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.2;
      max-width: 760px;
    }

    .prompt {
      margin: 0 0 18px;
      color: #323947;
      font-size: clamp(17px, 2vw, 21px);
      font-weight: 760;
      line-height: 1.55;
    }

    pre {
      margin: 0 0 18px;
      padding: 18px;
      border-radius: 8px;
      border: 1px solid #212a38;
      background: #151b26;
      color: #f2f7ff;
      font-family: var(--mono);
      font-size: clamp(13px, 1.5vw, 15px);
      line-height: 1.62;
      overflow: auto;
      tab-size: 4;
      white-space: pre;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .option {
      position: relative;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 64px;
      padding: 12px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      overflow-wrap: anywhere;
    }

    .option:hover {
      transform: translateY(-2px);
      border-color: #aab8c7;
    }

    .option .letter {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--surface-2);
      font-weight: 900;
    }

    .option.correct {
      border-color: var(--green);
      background: rgba(23, 138, 83, 0.08);
      box-shadow: 0 12px 30px rgba(23, 138, 83, 0.16);
    }

    .option.wrong {
      border-color: var(--coral);
      background: rgba(224, 91, 82, 0.08);
    }

    .option.disabled {
      cursor: default;
    }

    .feedback {
      min-height: 0;
      max-height: 0;
      padding: 0 14px;
      border: 0 solid transparent;
      border-radius: 8px;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.28s ease, opacity 0.22s ease, padding 0.22s ease, border-width 0.22s ease;
    }

    .feedback.show {
      max-height: 240px;
      padding: 14px;
      border-width: 1px;
      opacity: 1;
    }

    .feedback.good {
      border-color: rgba(23, 138, 83, 0.28);
      background: rgba(23, 138, 83, 0.08);
    }

    .feedback.bad {
      border-color: rgba(224, 91, 82, 0.28);
      background: rgba(224, 91, 82, 0.08);
    }

    .feedback strong {
      display: block;
      margin-bottom: 5px;
    }

    .feedback p {
      color: #334052;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .primary,
    .secondary,
    .danger {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 850;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
    }

    .primary {
      color: #fff;
      background: var(--blue);
      box-shadow: 0 12px 24px rgba(35, 103, 209, 0.24);
    }

    .secondary {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
    }

    .danger {
      color: #fff;
      background: var(--coral);
    }

    .primary:hover,
    .secondary:hover,
    .danger:hover {
      transform: translateY(-1px);
    }

    .primary:disabled,
    .secondary:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none;
      box-shadow: none;
    }

    .result-shell {
      display: grid;
      gap: 18px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .big-stat {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
    }

    .big-stat strong {
      display: block;
      font-size: 28px;
    }

    .big-stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .hidden {
      display: none !important;
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      animation: sparkFly 860ms cubic-bezier(.08,.7,.22,1) forwards;
    }

    .zap {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid var(--coral);
      border-radius: 8px;
      animation: zapFall 620ms ease forwards;
    }

    .footer-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
    }

    .footer-note a {
      color: var(--blue);
      font-weight: 800;
    }

    @keyframes correctPulse {
      0% { box-shadow: var(--shadow); }
      42% { box-shadow: 0 0 0 8px rgba(23, 138, 83, 0.14), 0 20px 70px rgba(23, 138, 83, 0.2); }
      100% { box-shadow: var(--shadow); }
    }

    @keyframes wrongShake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }

    @keyframes sparkFly {
      0% {
        transform: translate(-50%, -50%) rotate(0deg) scale(0.7);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1);
        opacity: 0;
      }
    }

    @keyframes zapFall {
      0% {
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
        opacity: 0.95;
      }
      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2) rotate(var(--rot));
        opacity: 0;
      }
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .rail {
        position: static;
        height: auto;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .chapter-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-height: 430px;
        overflow: auto;
        padding-right: 4px;
      }

      .stage {
        padding: 18px;
      }

      .topline {
        grid-template-columns: 1fr;
      }

      .stats {
        justify-content: stretch;
      }

      .stat {
        flex: 1;
      }
    }

    @media (max-width: 640px) {
      .rail,
      .stage {
        padding: 14px;
      }

      .brand {
        grid-template-columns: 46px 1fr;
      }

      .mark {
        width: 46px;
        height: 46px;
      }

      .segmented,
      .filter-row,
      .chapter-list,
      .options,
      .result-grid {
        grid-template-columns: 1fr;
      }

      .chapter-list {
        max-height: 310px;
      }

      .question-head {
        grid-template-columns: 1fr;
      }

      .source-link {
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="mark">IPP</div>
        <div>
          <h1>理解ドリル</h1>
          <p>コードの動きで確かめる</p>
        </div>
      </div>

      <div class="segmented" aria-label="出題モード">
        <button type="button" class="active" data-mode="chapter">章別</button>
        <button type="button" data-mode="all">全章</button>
        <button type="button" data-mode="code">コード</button>
        <button type="button" data-mode="weak">苦手</button>
      </div>

      <div class="filter-row" aria-label="章フィルタ">
        <button type="button" class="active" data-filter="all">全部</button>
        <button type="button" data-filter="main">本編</button>
        <button type="button" data-filter="advanced">発展</button>
      </div>

      <div class="rail-section-title">Chapters</div>
      <div id="chapterList" class="chapter-list"></div>
    </aside>

    <main class="stage">
      <div class="topline">
        <div class="meter-wrap">
          <div class="meter-label">
            <span id="meterText">0 / 0</span>
            <span id="modeText">章別</span>
          </div>
          <div class="meter" aria-hidden="true"><span id="meterBar"></span></div>
        </div>
        <div class="stats">
          <div class="stat"><strong id="correctCount">0</strong><span>正解</span></div>
          <div class="stat"><strong id="wrongCount">0</strong><span>見直し</span></div>
          <div class="stat"><strong id="masteryCount">0%</strong><span>定着</span></div>
        </div>
      </div>

      <section id="quizShell" class="quiz-shell">
        <div class="question-head">
          <div>
            <div class="kicker">
              <span id="chapterTag" class="tag">1-1</span>
              <span id="skillTag" class="tag logic">code</span>
            </div>
            <h2 id="questionTitle">問題を読み込み中</h2>
          </div>
          <a id="sourceLink" class="source-link" href="#" target="_blank" rel="noopener">教材</a>
        </div>

        <p id="prompt" class="prompt"></p>
        <pre id="codeBlock" class="hidden"><code></code></pre>
        <div id="options" class="options"></div>
        <div id="feedback" class="feedback" aria-live="polite"></div>

        <div class="actions">
          <div class="action-group">
            <button id="prevBtn" class="secondary" type="button">前へ</button>
            <button id="retryBtn" class="secondary" type="button">もう一度</button>
          </div>
          <div class="action-group">
            <button id="nextBtn" class="primary" type="button">次へ</button>
          </div>
        </div>
      </section>

      <section id="resultShell" class="result-shell hidden">
        <div>
          <div class="kicker">
            <span class="tag">Result</span>
          </div>
          <h2 id="resultTitle">結果</h2>
        </div>
        <div class="result-grid">
          <div class="big-stat"><strong id="resultScore">0</strong><span>今回の正解</span></div>
          <div class="big-stat"><strong id="resultRate">0%</strong><span>今回の正答率</span></div>
          <div class="big-stat"><strong id="resultMiss">0</strong><span>復習候補</span></div>
        </div>
        <div class="actions">
          <button id="reviewBtn" class="secondary" type="button">間違いを復習</button>
          <div class="action-group">
            <button id="againBtn" class="secondary" type="button">もう1セットやる</button>
            <button id="nextSetBtn" class="primary" type="button">次のセットへ進む</button>
          </div>
        </div>
      </section>

      <p class="footer-note">
        問題は教材の章構成に合わせたオリジナル作問です。出典:
        <a href="https://utokyo-ipp.github.io/index.html" target="_blank" rel="noopener">Pythonプログラミング入門</a>
        /
        <a href="https://colab.research.google.com/github/toufx6367/ipp-understanding-drill/blob/main/notebooks/ipp_runnable_companion.ipynb" target="_blank" rel="noopener">実行Notebook</a>
      </p>
    </main>
  </div>
  <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>

  <script>
    const chapters = [
      { id: "1-0", group: "main", title: "1-0. Colaboratory (Colab) の使い方", url: "https://utokyo-ipp.github.io/1/1-0.html" },
      { id: "1-1", group: "main", title: "1-1. 数値演算", url: "https://utokyo-ipp.github.io/1/1-1.html" },
      { id: "1-2", group: "main", title: "1-2. 変数と関数の基礎", url: "https://utokyo-ipp.github.io/1/1-2.html" },
      { id: "1-3", group: "main", title: "1-3. 論理・比較演算と条件分岐の基礎", url: "https://utokyo-ipp.github.io/1/1-3.html" },
      { id: "1-4", group: "main", title: "1-4. テストとデバッグ", url: "https://utokyo-ipp.github.io/1/1-4.html" },
      { id: "2-1", group: "main", title: "2-1. 文字列 (string)", url: "https://utokyo-ipp.github.io/2/2-1.html" },
      { id: "2-2", group: "main", title: "2-2. リスト (list)", url: "https://utokyo-ipp.github.io/2/2-2.html" },
      { id: "2-3", group: "main", title: "2-3. 条件分岐", url: "https://utokyo-ipp.github.io/2/2-3.html" },
      { id: "3-1", group: "main", title: "3-1. 辞書 (dictionary)", url: "https://utokyo-ipp.github.io/3/3-1.html" },
      { id: "3-2", group: "main", title: "3-2. 繰り返し", url: "https://utokyo-ipp.github.io/3/3-2.html" },
      { id: "3-3", group: "main", title: "3-3. 関数", url: "https://utokyo-ipp.github.io/3/3-3.html" },

    const questionBank = questions.concat(extraQuestions);

    const chapterMap = new Map(chapters.map(chapter => [chapter.id, chapter]));
    const progressKey = "ipp-quiz-progress-v1";
    const setSize = 5;
    const letters = ["A", "B", "C", "D"];
    const modeLabels = {
      chapter: "章別",
      all: "全章",
      code: "コード",
      weak: "苦手"
    };

    const state = {
      mode: "chapter",
      filter: "all",
      chapter: "1-0",
      deck: [],
      index: 0,
      answered: false,
      selected: null,
      session: {},
      lastMisses: [],
      optionOrders: {}
    };

    const els = {
      chapterList: document.querySelector("#chapterList"),
      quizShell: document.querySelector("#quizShell"),
      resultShell: document.querySelector("#resultShell"),
      chapterTag: document.querySelector("#chapterTag"),
      skillTag: document.querySelector("#skillTag"),
      questionTitle: document.querySelector("#questionTitle"),
      sourceLink: document.querySelector("#sourceLink"),
      prompt: document.querySelector("#prompt"),
      codeBlock: document.querySelector("#codeBlock"),
      code: document.querySelector("#codeBlock code"),
      options: document.querySelector("#options"),
      feedback: document.querySelector("#feedback"),
      prevBtn: document.querySelector("#prevBtn"),
      retryBtn: document.querySelector("#retryBtn"),
      nextBtn: document.querySelector("#nextBtn"),
      meterText: document.querySelector("#meterText"),
      meterBar: document.querySelector("#meterBar"),
      modeText: document.querySelector("#modeText"),
      correctCount: document.querySelector("#correctCount"),
      wrongCount: document.querySelector("#wrongCount"),
      masteryCount: document.querySelector("#masteryCount"),
      resultTitle: document.querySelector("#resultTitle"),
      resultScore: document.querySelector("#resultScore"),
      resultRate: document.querySelector("#resultRate"),
      resultMiss: document.querySelector("#resultMiss"),
      reviewBtn: document.querySelector("#reviewBtn"),
      againBtn: document.querySelector("#againBtn"),
      nextSetBtn: document.querySelector("#nextSetBtn"),
      fxLayer: document.querySelector("#fxLayer")
    };

    let progress = loadProgress();

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(progressKey)) || {};
      } catch {
        return {};
      }
    }

    function saveProgress() {
      localStorage.setItem(progressKey, JSON.stringify(progress));
    }

    function questionsForFilter() {
      return questionBank.filter(question => {
        const chapter = chapterMap.get(question.chapter);
        return state.filter === "all" || chapter.group === state.filter;
      });
    }

    function chaptersForFilter() {
      return chapters.filter(chapter => state.filter === "all" || chapter.group === state.filter);
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildDeck() {
      const pool = questionsForFilter();
      if (state.mode === "chapter") {
        return pool.filter(question => question.chapter === state.chapter).slice(0, setSize);
      }
      if (state.mode === "code") {
        return shuffle(pool.filter(question => ["code", "function", "debug"].includes(question.skill))).slice(0, setSize);
      }
      if (state.mode === "weak") {
        const weak = pool.filter(question => (progress[question.id]?.wrong || 0) > 0 && !progress[question.id]?.mastered);
        return shuffle(weak.length ? weak : pool).slice(0, setSize);
      }
      return shuffle(pool).slice(0, setSize);
    }

    function startDeck(deck = buildDeck()) {
      state.deck = deck.length ? deck : questionsForFilter().slice(0, 1);
      state.index = 0;
      state.answered = false;
      state.selected = null;
      state.session = {};
      state.lastMisses = [];
      state.optionOrders = {};
      els.resultShell.classList.add("hidden");
      els.quizShell.classList.remove("hidden");
      render();
    }

    function currentQuestion() {
      return state.deck[state.index];
    }

    function optionOrderFor(question) {
      if (!state.optionOrders[question.id]) {
        state.optionOrders[question.id] = shuffle(question.choices.map((_, index) => index));
      }
      return state.optionOrders[question.id];
    }

    function renderChapters() {
      const visible = chaptersForFilter();
      els.chapterList.innerHTML = "";
      visible.forEach(chapter => {
        const qs = questionBank.filter(question => question.chapter === chapter.id);
        const done = qs.filter(question => progress[question.id]?.correct).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `chapter-button${chapter.id === state.chapter ? " active" : ""}`;
        btn.dataset.chapter = chapter.id;
        btn.innerHTML = `
          <span>
            <span class="chapter-title">${escapeHtml(chapter.title)}</span>
            <span class="chapter-meta">${chapter.group === "main" ? "本編" : "発展"} / ${qs.length}問</span>
          </span>
          <span class="pill">${done}/${qs.length}</span>
        `;
        btn.addEventListener("click", () => {
          state.chapter = chapter.id;
          state.mode = "chapter";
          setActiveButtons();
          renderChapters();
          startDeck();
        });
        els.chapterList.appendChild(btn);
      });
    }

    function render() {
      const question = currentQuestion();
      const chapter = chapterMap.get(question.chapter);
      els.chapterTag.textContent = chapter.id;
      els.skillTag.textContent = question.tag;
      els.skillTag.className = `tag ${question.skill === "debug" ? "debug" : question.skill === "library" ? "library" : question.skill === "logic" ? "logic" : ""}`;
      els.questionTitle.textContent = question.title;
      els.sourceLink.href = chapter.url;
      els.prompt.textContent = question.prompt;
      if (question.code) {
        els.codeBlock.classList.remove("hidden");
        els.code.textContent = question.code;
      } else {
        els.codeBlock.classList.add("hidden");
        els.code.textContent = "";
      }

      els.options.innerHTML = "";
      optionOrderFor(question).forEach((choiceIndex, displayIndex) => {
        const choice = question.choices[choiceIndex];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.dataset.choiceIndex = String(choiceIndex);
        btn.innerHTML = `<span class="letter">${letters[displayIndex]}</span><span>${escapeHtml(choice).replace(/\n/g, "<br>")}</span>`;
        btn.addEventListener("click", () => answer(displayIndex));
        els.options.appendChild(btn);
      });

      els.feedback.className = "feedback";
      els.feedback.innerHTML = "";
      state.answered = false;
      state.selected = null;
      updateMeter();
      updateStats();
      els.prevBtn.disabled = state.index === 0;
      els.retryBtn.disabled = false;
      els.nextBtn.textContent = state.index === state.deck.length - 1 ? "結果" : "次へ";
      renderChapters();
    }

    function snapToQuiz() {
      requestAnimationFrame(() => {
        els.quizShell.scrollIntoView({ block: "start", behavior: "smooth" });
      });
    }

    function answer(index) {
      if (state.answered) return;
      const question = currentQuestion();
      const optionOrder = optionOrderFor(question);
      const choiceIndex = optionOrder[index];
      const correctDisplayIndex = optionOrder.indexOf(question.answer);
      const isCorrect = choiceIndex === question.answer;
      state.answered = true;
      state.selected = index;
      state.session[question.id] = isCorrect;

      if (!progress[question.id]) progress[question.id] = { attempts: 0, correct: 0, wrong: 0, mastered: false };
      progress[question.id].attempts += 1;
      if (isCorrect) {
        progress[question.id].correct += 1;
        if ((progress[question.id].wrong || 0) === 0 || progress[question.id].correct >= 2) {
          progress[question.id].mastered = true;
        }
      } else {
        progress[question.id].wrong += 1;
        progress[question.id].mastered = false;
        if (!state.lastMisses.includes(question.id)) state.lastMisses.push(question.id);
      }
      saveProgress();

      [...els.options.children].forEach((btn, optionIndex) => {
        btn.classList.add("disabled");
        if (optionIndex === correctDisplayIndex) btn.classList.add("correct");
        if (optionIndex === index && !isCorrect) btn.classList.add("wrong");
      });

      els.feedback.className = `feedback show ${isCorrect ? "good" : "bad"}`;
      els.feedback.innerHTML = `
        <strong>${isCorrect ? "正解" : "もう一歩"}</strong>
        <p>${escapeHtml(question.explain)}</p>
      `;
      animateAnswer(isCorrect);
      updateStats();
      renderChapters();
    }

    function retryQuestion() {
      state.answered = false;
      state.selected = null;
      els.feedback.className = "feedback";
      els.feedback.innerHTML = "";
      [...els.options.children].forEach(btn => {
        btn.className = "option";
      });
    }

    function nextQuestion() {
      if (state.index >= state.deck.length - 1) {
        showResult();
        return;
      }
      state.index += 1;
      render();
      snapToQuiz();
    }

    function prevQuestion() {
      if (state.index === 0) return;
      state.index -= 1;
      render();
      snapToQuiz();
    }

    function showResult() {
      const values = Object.values(state.session);
      const correct = values.filter(Boolean).length;
      const answered = values.length || state.deck.length;
      const rate = answered ? Math.round((correct / answered) * 100) : 0;
      els.quizShell.classList.add("hidden");
      els.resultShell.classList.remove("hidden");
      els.resultTitle.textContent = rate >= 80 ? "かなり読めています" : rate >= 50 ? "伸びしろが見えました" : "ここから固めましょう";
      els.resultScore.textContent = `${correct}/${state.deck.length}`;
      els.resultRate.textContent = `${rate}%`;
      els.resultMiss.textContent = `${state.lastMisses.length}`;
      els.reviewBtn.disabled = state.lastMisses.length === 0;
      const nextChapter = getNextChapter();
      if (state.mode === "chapter" && nextChapter) {
        els.nextSetBtn.textContent = `次のセットへ進む`;
        els.nextSetBtn.disabled = false;
      } else {
        els.nextSetBtn.textContent = "次のセットへ進む";
        els.nextSetBtn.disabled = false;
      }
      updateMeter();
      updateStats();
    }

    function getNextChapter() {
      const visible = chaptersForFilter();
      const currentIndex = visible.findIndex(chapter => chapter.id === state.chapter);
      if (currentIndex === -1 || visible.length === 0) return null;
      return visible[(currentIndex + 1) % visible.length];
    }

    function startNextSet() {
      if (state.mode === "chapter") {
        const nextChapter = getNextChapter();
        if (nextChapter) state.chapter = nextChapter.id;
      }
      renderChapters();
      startDeck();
      snapToQuiz();
    }

    function updateMeter() {
      const total = state.deck.length || 1;
      const current = Math.min(state.index + 1, total);
      els.meterText.textContent = `${current} / ${total}`;
      els.meterBar.style.width = `${Math.round((current / total) * 100)}%`;
      els.modeText.textContent = modeLabels[state.mode];
    }

    function updateStats() {
      const filtered = questionsForFilter();
      const correct = filtered.filter(question => progress[question.id]?.correct).length;
      const wrong = filtered.reduce((sum, question) => sum + (progress[question.id]?.wrong || 0), 0);
      const mastery = filtered.length ? Math.round((correct / filtered.length) * 100) : 0;
      els.correctCount.textContent = correct;
      els.wrongCount.textContent = wrong;
      els.masteryCount.textContent = `${mastery}%`;
    }

    function animateAnswer(isCorrect) {
      els.quizShell.classList.remove("correct-pulse", "wrong-shake");
      void els.quizShell.offsetWidth;
      els.quizShell.classList.add(isCorrect ? "correct-pulse" : "wrong-shake");

      const rect = els.quizShell.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 4;
      const colors = isCorrect
        ? ["#178a53", "#2367d1", "#d79212", "#008c8c", "#6d5bd0"]
        : ["#e05b52", "#d79212", "#697386"];
      const count = isCorrect ? 34 : 18;
      for (let i = 0; i < count; i++) {
        const node = document.createElement("span");
        node.className = isCorrect ? "spark" : "zap";
        const angle = (Math.PI * 2 * i) / count;
        const distance = (isCorrect ? 100 : 62) + Math.random() * (isCorrect ? 130 : 40);
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;
        node.style.background = colors[i % colors.length];
        node.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        node.style.setProperty("--dy", `${Math.sin(angle) * distance + (isCorrect ? -30 : 50)}px`);
        node.style.setProperty("--rot", `${Math.random() * 720 - 360}deg`);
        els.fxLayer.appendChild(node);
        setTimeout(() => node.remove(), 920);
      }
    }

    function setActiveButtons() {
      document.querySelectorAll("[data-mode]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === state.mode);
      });
      document.querySelectorAll("[data-filter]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filter === state.filter);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.querySelectorAll("[data-mode]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.mode = btn.dataset.mode;
        setActiveButtons();
        startDeck();
      });
    });

    document.querySelectorAll("[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.filter = btn.dataset.filter;
        const visible = chaptersForFilter();
        if (!visible.some(chapter => chapter.id === state.chapter)) {
          state.chapter = visible[0]?.id || "1-0";
        }
        setActiveButtons();
        renderChapters();
        startDeck();
      });
    });

    els.nextBtn.addEventListener("click", nextQuestion);
    els.prevBtn.addEventListener("click", prevQuestion);
    els.retryBtn.addEventListener("click", retryQuestion);
    els.againBtn.addEventListener("click", () => {
      startDeck();
      snapToQuiz();
    });
    els.nextSetBtn.addEventListener("click", startNextSet);
    els.reviewBtn.addEventListener("click", () => {
      const reviewDeck = state.lastMisses
        .map(id => questionBank.find(question => question.id === id))
        .filter(Boolean);
      state.mode = "weak";
      setActiveButtons();
      startDeck(reviewDeck);
    });

    document.addEventListener("keydown", event => {
      if (event.key >= "1" && event.key <= "4" && !state.answered && !els.quizShell.classList.contains("hidden")) {
        answer(Number(event.key) - 1);
      }
      if (event.key === "Enter" && state.answered && !els.quizShell.classList.contains("hidden")) {
        nextQuestion();
      }
    });

    renderChapters();
    startDeck();
  </script>
</body>
</html>
